<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1731;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #eef3fb;
      }

      .recording {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .titlebar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        height: 80px;
        padding: 0 38px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(13, 23, 49, 0.9);
        box-shadow: 0 10px 34px rgba(13, 23, 49, 0.2);
        color: #fff;
        backdrop-filter: blur(20px);
      }

      .brand {
        display: flex;
        gap: 13px;
        align-items: center;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 11px;
      }

      .brand-name {
        font-size: 23px;
        font-weight: 730;
        letter-spacing: -0.025em;
      }

      .title {
        position: absolute;
        left: 50%;
        color: #fff;
        font-size: 29px;
        font-weight: 720;
        letter-spacing: -0.035em;
        white-space: nowrap;
        transform: translateX(-50%);
      }

      .audience {
        margin-left: auto;
        padding: 9px 14px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 16px;
        font-weight: 650;
        white-space: nowrap;
      }

      .instruction {
        position: absolute;
        bottom: 30px;
        left: 50%;
        z-index: 2;
        padding: 14px 22px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 999px;
        background: rgba(13, 23, 49, 0.82);
        box-shadow: 0 18px 42px rgba(13, 23, 49, 0.28);
        color: #fff;
        font-size: 19px;
        font-weight: 680;
        letter-spacing: -0.012em;
        white-space: nowrap;
        transform: translateX(-50%);
        backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="tw-nowledge-install-demo"
      data-no-timeline
      data-start="0"
      data-duration="19.2"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <video
        id="installation-recording"
        class="recording"
        src="assets/install-tw-nowledge.mp4"
        data-start="0"
        data-duration="19.2"
        data-media-start="0"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <header class="titlebar">
        <div class="brand">
          <img src="assets/nmem.png" alt="" />
          <span class="brand-name">tw-nowledge</span>
        </div>
        <div class="title">Install by drag and drop</div>
        <div class="audience">Static HTML + Node.js TiddlyWiki</div>
      </header>
      <div class="instruction">Drag both plugin cards into your wiki. Import, save, and reload.</div>
    </div>
  </body>
</html>
